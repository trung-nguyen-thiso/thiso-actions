name: Publish images (reusable)

# Shared by any repo: build + push one or more Docker image targets to a private registry,
# tagged both with a version and "latest". Verifies push access with a throwaway tag before
# the (slow) real build, so a bad credential/permission fails in seconds.
#
# Caller usage (in the calling repo's own .github/workflows/publish.yml):
#
#   name: Publish images
#   on:
#     push:
#       tags: ["v*.*.*"]
#   jobs:
#     publish:
#       uses: trung-nguyen-thiso/thiso-actions/.github/workflows/publish-images.yml@main
#       with:
#         registry: registry.thisoretail.store
#         namespace: emart_it
#         images: |
#           [
#             {"target": "final", "name": "sync-host"},
#             {"target": "adminui", "name": "sync-admin-ui"}
#           ]
#       secrets:
#         registry-username: ${{ secrets.REGISTRY_USERNAME }}
#         registry-password: ${{ secrets.REGISTRY_PASSWORD }}
#
# "images" is a JSON array of {target, name} — target is the Dockerfile build stage, name is
# the image repo name under registry/namespace. One entry per image the repo builds; any count.
#
# The version tag is derived from GITHUB_REF_NAME by taking everything after the LAST "v"
# immediately preceding a semver: "v1.4.0" -> "1.4.0", and "web-v1.0.0" (a per-image tag
# prefix, e.g. platform-digital-plan tagging four images independently as auth-vX.Y.Z /
# core-vX.Y.Z / web-vX.Y.Z / policy-vX.Y.Z out of one repo) -> "1.0.0".
#
# "build-args" (optional) is a newline-separated KEY=VALUE list passed straight through to
# docker/build-push-action, e.g. for a frontend image that inlines a public API base URL at
# build time.
#
# Optional deploy job (2026-09-06, opt-in): set `deploy: true` to SSH-deploy the built
# service on the VPS immediately after build+push succeeds. The deploy target IP is NOT a
# hardcoded secret — it's resolved at deploy time from Cloudflare's DNS A-record for
# `deploy-hostname`, via the Cloudflare API (not a plain DNS lookup, since these hostnames
# are Cloudflare-proxied and a normal DNS resolution would return Cloudflare's edge IP, not
# the VPS's real IP). This means the VPS's IP can change without any workflow needing a
# manual secret update — only Cloudflare's DNS record needs to stay current.
#
# Callers that don't pass `deploy: true` (e.g. multi-tenant-sync) are completely unaffected
# — the deploy job is skipped and none of the deploy-* inputs/secrets are required.
#
# Deploy caller usage (added to the `with:` block above):
#   deploy: true
#   deploy-hostname: thiso-web.williamthanhtrung.id.vn   # whichever public hostname shares the VPS
#   deploy-compose-service: web                          # docker-compose service name to pull+recreate
#   deploy-repo-path: ~/repo/platform-digital-plan        # optional, this is the default
# and in `secrets:`:
#   cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#   vps-ssh-key: ${{ secrets.VPS_SSH_KEY }}

on:
  workflow_call:
    inputs:
      registry:
        description: "Registry host, e.g. registry.thisoretail.store"
        required: true
        type: string
      namespace:
        description: "Registry namespace/project, e.g. emart_it"
        required: true
        type: string
      images:
        description: 'JSON array of {"target": "<dockerfile-stage>", "name": "<image-name>"}'
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile, relative to context"
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      build-args:
        description: "Newline-separated KEY=VALUE build args, passed through to docker/build-push-action"
        required: false
        type: string
        default: ""
      deploy:
        description: "Opt-in: SSH-deploy deploy-compose-service on the VPS after build+push, target IP resolved via Cloudflare"
        required: false
        type: boolean
        default: false
      deploy-hostname:
        description: "Public hostname whose Cloudflare A-record currently points at the target VPS (e.g. thiso-web.williamthanhtrung.id.vn) — required when deploy is true"
        required: false
        type: string
        default: ""
      deploy-compose-service:
        description: "docker-compose service name to `pull` + `up -d` on the VPS (e.g. web, auth, core, policy) — required when deploy is true"
        required: false
        type: string
        default: ""
      deploy-repo-path:
        description: "Path on the VPS to the docker-compose project directory"
        required: false
        type: string
        default: "~/repo/platform-digital-plan"
      deploy-ssh-user:
        description: "SSH user on the VPS"
        required: false
        type: string
        default: "tuf"
    secrets:
      registry-username:
        required: true
      registry-password:
        required: true
      cloudflare-api-token:
        description: "Required when deploy is true"
        required: false
      vps-ssh-key:
        description: "Private half of a keypair whose public half is in the VPS's ~/.ssh/authorized_keys. Required when deploy is true"
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      # Strips everything up through the last "v" before the semver, so both a bare
      # "v1.4.0" (multi-tenant-sync's scheme) and a per-service-prefixed "web-v1.0.0"
      # (platform-digital-plan's scheme, one tag prefix per image in a shared repo)
      # resolve to the same "1.4.0" / "1.0.0" — plain `${GITHUB_REF_NAME#v}` only
      # strips a LEADING "v", which does nothing for "web-v1.0.0".
      - name: Derive version from tag
        id: version
        run: |
          version=$(echo "$GITHUB_REF_NAME" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+$')
          if [ -z "$version" ]; then
            echo "::error::Could not extract a vX.Y.Z version from tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      # Login only checks credentials, not push permission into this specific namespace —
      # push a throwaway tag first so a permission problem fails in seconds, not after the
      # full multi-stage build.
      - name: Verify registry push access
        run: |
          docker pull --quiet alpine:3
          docker tag alpine:3 ${{ inputs.registry }}/${{ inputs.namespace }}/ci-probe:${{ github.run_id }}
          docker push ${{ inputs.registry }}/${{ inputs.namespace }}/ci-probe:${{ github.run_id }}

  build:
    needs: probe
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJson(inputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - uses: docker/setup-buildx-action@v3

      - name: Build + push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ matrix.image.target }}
          build-args: ${{ inputs.build-args }}
          push: true
          tags: |
            ${{ inputs.registry }}/${{ inputs.namespace }}/${{ matrix.image.name }}:${{ needs.probe.outputs.version }}
            ${{ inputs.registry }}/${{ inputs.namespace }}/${{ matrix.image.name }}:latest

  deploy:
    needs: [probe, build]
    if: inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      # Resolve the VPS's CURRENT IP from Cloudflare's own DNS record for deploy-hostname,
      # rather than a plain `dig`/`nslookup` — these hostnames are Cloudflare-proxied, so a
      # normal DNS resolution returns Cloudflare's edge IP, not the VPS. The Cloudflare API
      # returns the real configured origin IP regardless of proxy status.
      - name: Resolve VPS IP via Cloudflare
        id: resolve
        env:
          CF_TOKEN: ${{ secrets.cloudflare-api-token }}
          HOSTNAME: ${{ inputs.deploy-hostname }}
        run: |
          if [ -z "$HOSTNAME" ]; then
            echo "::error::deploy-hostname is required when deploy: true"
            exit 1
          fi
          zone_name=$(echo "$HOSTNAME" | cut -d. -f2-)
          zone_id=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=${zone_name}" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::Could not resolve Cloudflare zone id for $zone_name"
            exit 1
          fi
          ip=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=A&name=${HOSTNAME}" | jq -r '.result[0].content // empty')
          if [ -z "$ip" ]; then
            echo "::error::Could not resolve an A record for $HOSTNAME"
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: SSH deploy ${{ inputs.deploy-compose-service }}
        env:
          SSH_KEY: ${{ secrets.vps-ssh-key }}
          TARGET_IP: ${{ steps.resolve.outputs.ip }}
          SSH_USER: ${{ inputs.deploy-ssh-user }}
          REPO_PATH: ${{ inputs.deploy-repo-path }}
          COMPOSE_SERVICE: ${{ inputs.deploy-compose-service }}
        run: |
          if [ -z "$COMPOSE_SERVICE" ]; then
            echo "::error::deploy-compose-service is required when deploy: true"
            exit 1
          fi
          install -m 600 /dev/null id_deploy
          printf '%s\n' "$SSH_KEY" > id_deploy
          ssh -i id_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p 22 \
            "${SSH_USER}@${TARGET_IP}" \
            "cd ${REPO_PATH} && docker compose pull ${COMPOSE_SERVICE} && docker compose up -d ${COMPOSE_SERVICE}"
          rm -f id_deploy
